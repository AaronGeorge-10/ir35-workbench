<title>Page not found | IR35 Workbench</title>
<link rel="icon" href="/site-assets/img/Ascend_Favicon.ico" sizes="any">
<script>
/* R-45 (Aaron, 1 Oct 2026): never a 404 because of a capital letter.
   GitHub Pages addresses are case-sensitive; every Workbench address is lower case
   (build.py refuses anything else). So when an address with a capital in it misses,
   send the visitor to the lower-case address, keeping the query string and the
   #fragment (sign-in links carry them). An address that is already lower case and
   still missing is a genuine "not found" and is shown below - no redirect, no loop. */
(function(){
  var p = location.pathname, l = p.toLowerCase();
  if (l !== p) { location.replace(l + location.search + location.hash); }
})();
</script>
